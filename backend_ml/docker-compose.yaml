services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: robot
      POSTGRES_PASSWORD: robot
      POSTGRES_DB: telemetry
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U robot -d telemetry"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      BACKEND_DATABASE_URL: postgresql+psycopg://robot:robot@db:5432/telemetry
    ports:
      - "8000:8000"
      - "50051:50051"
    volumes:
      - ".:/srv"

  ml-worker:
    build:
      context: ../ML
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    volumes:
      - ../ML/app:/app/app
    environment:
      BACKEND_API_URL: http://backend:8000
      POLL_INTERVAL_S: "${ML_POLL_INTERVAL_S:-30}"
      ANALYSIS_WINDOW_S: "${ML_ANALYSIS_WINDOW_S:-600}"
      MAX_POINTS: "${ML_MAX_POINTS:-50000}"
      ANOMALY_THRESHOLD: "${ML_ANOMALY_THRESHOLD:-0.6}"
      CHECK_IDLE: "${ML_CHECK_IDLE:-false}"

volumes:
  pgdata:
